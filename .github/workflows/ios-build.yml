name: iOS App Build & Test (GitHub Cloud Runner)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App iOS en Mac Cloud Runner
    runs-on: macos-14 # Runner oficial de GitHub con macOS y Apple Silicon (M2)

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Copiar GoogleService-Info.plist
        run: |
          if [ -f "GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist detectado correctamente."
          else
            echo "Aviso: No se encontró GoogleService-Info.plist en la raíz."
          fi

      - name: Verificar herramientas de Swift
        run: |
          swift --version

      - name: Compilar librería y componentes iOS en Swift
        run: |
          cd ios
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0-simulator"

      - name: Ejecutar pruebas unitarias de lógica y márgenes
        run: |
          cd ios
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift test -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0-simulator"
