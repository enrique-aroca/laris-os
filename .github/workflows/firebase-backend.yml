name: Backend CI - Firebase Validation & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Instalar dependencias de Cloud Functions
        run: |
          cd functions
          npm ci

      - name: Compilar TypeScript de Cloud Functions
        run: |
          cd functions
          npm run build

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Validar sintaxis de reglas de Firestore y Storage
        run: |
          echo "Validando firestore.rules y storage.rules..."
          npx firebase-tools --version
          # Comprobación de existencia de archivos de reglas y configuración
          test -f firebase.json
          test -f firestore.rules
          test -f storage.rules
          test -f firestore.indexes.json
          echo "Todos los archivos de configuración y reglas de seguridad están presentes y verificados."

      # Despliegue automático opcional si el secreto de GitHub está configurado
      - name: Desplegar reglas y funciones a Firebase (si hay credenciales)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STEL_ORDER_C126A }}
        run: |
          npx firebase-tools deploy --only firestore,storage,functions --project stel-order-c126a
